# Distrobox assemble example for a mutable Void userland on an immutable host.
#
# Apps priority: Flatpak → Sourcing → Distrobox (#3) → AppImage.
#   distrobox assemble create --file tooling/container/product/examples/distrobox.ini
#
# pull=false: voidling-minimal:local is built locally, not pulled from a registry.
# Distrobox will install its own helper packages (bash, sudo, …) into this
# container; that is expected and does not change the host.

[voidling]
image=voidling-minimal:local
pull=false
init=false
