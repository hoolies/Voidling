# Voidling live ISO initramfs (dracut dmsquash + overlayfs).
#
# install-live-dracut.sh passes this file to dracut via a temporary
# --confdir. Do not copy it into the composed rootfs or /usr/etc.
#
# dmsquash-live is skipped when hostonly is set (see its module-setup.sh).
# Live media is squashfs, not an OSTree sysroot — omit voidling-ostree
# (same split as the prototype qcow2). The OSTree initrd in the tree stays.

hostonly="no"
hostonly_cmdline="no"
omit_dracutmodules+=" voidling-ostree zfs 02zfsexpandknowledge "
add_dracutmodules+=" dmsquash-live overlayfs pollcdrom "
add_drivers+=" iso9660 squashfs overlay loop sr_mod cdrom virtio_blk virtio_pci virtio_scsi ahci sd_mod zfs "
