# Honor ostree= via 98voidling-ostree (runit). Do not pull systemd into the initramfs.
# crypt is included so a LUKS root can be unlocked. zswap stays off at boot.
# virtio + btrfs are required for QEMU and the default Btrfs install layout.
add_dracutmodules+=" voidling-ostree crypt "
add_drivers+=" virtio_blk virtio_pci virtio_scsi virtio_net btrfs "
filesystems+=" btrfs "
