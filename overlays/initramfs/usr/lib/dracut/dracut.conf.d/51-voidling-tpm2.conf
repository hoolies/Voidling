# TPM2 auto-unlock for a LUKS root (opt-in; compose WITH_TPM2=1).
#
# install-ostree-initramfs.sh copies this snippet only when the tree has
# clevis-decrypt-tpm2. The clevis dracut module has a non-systemd path
# (initqueue/settled unlocker) that calls 'clevis luks unlock' before the
# crypt module falls back to the passphrase prompt. GRUB still asks once
# (cryptomount, PBKDF2 slot); the initramfs then opens the argon2id slot
# via the TPM2-sealed key instead of asking again.
#
# Drivers: tpm_tis/tpm_crb are modules on some Void kernels; builtins are
# a harmless no-op here.
add_dracutmodules+=" clevis-pin-tpm2 "
add_drivers+=" tpm tpm_tis tpm_tis_core tpm_crb "
