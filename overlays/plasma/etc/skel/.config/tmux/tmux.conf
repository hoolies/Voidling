# Configurations

## Colour
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

## Mouse support
set -g mouse on

## Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

## Bindings
### set vi mode
set-window-option -g mode-keys vi

### Enable Vi Visual mode (y comes from tmux-yank → wl-copy)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

### Open panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"

### Toggle synchronize panes
bind "a" setw synchronize-panes

### Toggle tmux status bar
bind "`" set -g status

### Create a named window
bind "c" command-prompt -p "Window Name:" "new-window -n '%%'"

### Swapping windows
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

### Decide whether we're in a Vim process
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'M-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
bind-key -n 'M-Space' if-shell "$is_vim" 'send-keys C-Space' 'select-pane -t:.+'

bind-key -T copy-mode-vi 'M-h' select-pane -L
bind-key -T copy-mode-vi 'M-j' select-pane -D
bind-key -T copy-mode-vi 'M-k' select-pane -U
bind-key -T copy-mode-vi 'M-l' select-pane -R
bind-key -T copy-mode-vi 'M-\' select-pane -l
bind-key -T copy-mode-vi 'M-Space' select-pane -t:.+

## Load plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'janoamaral/tokyo-night-tmux'
set -g @plugin 'niqodea/tmux-matryoshka'
set -g @plugin 'rickstaa/tmux-notify'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tpm'

# Wayland: send copy-mode yanks to the compositor clipboard (clipse / wl-paste).
set -g @override_copy_command 'wl-copy'
set -g @yank_selection 'clipboard'
set -g @yank_selection_mouse 'clipboard'

set -g @continuum-restore 'on'

## Activate TPM when it is already installed (do not clone on startup).
if-shell 'test -d "$HOME/.tmux/plugins/tpm"' 'run-shell "$HOME/.tmux/plugins/tpm/tpm"'
